name: OKF Portal (validate + build + deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OKF frontmatter
        run: |
          fail=0
          for f in $(git ls-files '*.md' | grep -vE 'README|_sidebar'); do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "❌ $f: missing OKF frontmatter"; fail=1
            elif ! grep -q '^okf_version:' "$f"; then
              echo "❌ $f: missing okf_version"; fail=1
            fi
          done
          exit $fail

      - name: Build manifest + sidebar (GraphRAG graph)
        run: python3 scripts/build_okf_portal.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
